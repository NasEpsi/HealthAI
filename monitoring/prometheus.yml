global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "healthai-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "healthai-ai-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai_service:8000"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
