[project]
name = "healthai"
version = "0.1.0"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "requests",
  "prometheus-client",
  "cloudinary>=1.41.0",
  "python-multipart>=0.0.9"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"