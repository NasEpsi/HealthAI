services:
  db:
    image: postgres:16
    container_name: healthai_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: healthai_api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data

  ai_service:
    build: ./ai-service
    container_name: healthai_ai
    ports:
      - "8001:8000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: healthai_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  pgadmin:
    image: dpage/pgadmin4
    container_name: healthai_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nas.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  prometheus:
    image: prom/prometheus
    container_name: healthai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
      - ai_service

  grafana:
    image: grafana/grafana
    container_name: healthai_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  mongo_data:
  grafana_data: