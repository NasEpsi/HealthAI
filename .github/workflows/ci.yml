name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: healthai
      POSTGRES_USER: healthai
      POSTGRES_PASSWORD: healthai_pass
      POSTGRES_PORT: 5432
      API_PORT: 8000
      API_KEY: healthai
      DATABASE_URL: postgresql+psycopg2://healthai:healthai_pass@db:5432/healthai
      CLOUDINARY_CLOUD_NAME: demo
      CLOUDINARY_UPLOAD_PRESET: demo
      CLOUDINARY_API_KEY: demo
      CLOUDINARY_API_SECRET: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic sqlalchemy psycopg2-binary alembic pandas python-dotenv requests prometheus-client cloudinary python-multipart pytest httpx pymongo

      - name: Run backend tests
        env:
          PYTHONPATH: backend/src
        run: pytest backend/src/tests -q

      - name: Run AI tests
        env:
          PYTHONPATH: ai-service/src
        run: pytest ai-service/tests -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Validate docker compose config
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -t healthai-backend ./backend

      - name: Build AI service Docker image
        run: docker build -t healthai-ai ./ai-service
